<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>仙途 · 放置修仙 v0.3</title>
<style>
/* ===== 全局 ===== */
:root {
  --bg: #06060e;
  --gold: #c9a84c;
  --gold-bright: #f5d98e;
  --jade: #4db88d;
  --danger: #e04343;
  --text: #b8b8c8;
  --text-dim: #8888a0;
  --rarity-common: #9d9d9d;
  --rarity-uncommon: #4db88d;
  --rarity-rare: #4d8de0;
  --rarity-epic: #b04de0;
  --rarity-legendary: #e0a800;
  --rarity-mythic: #ff4444;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  overflow:hidden;
  height:100vh;height:100dvh;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
  transition: background 1s;
}

/* ===== 粒子背景 ===== */
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.particle{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  animation:drift linear forwards;
}
.particle.qi{background:radial-gradient(circle,var(--gold-bright),transparent);box-shadow:0 0 6px var(--gold)}
.particle.jade{background:radial-gradient(circle,#4db88d,transparent);box-shadow:0 0 6px #4db88d}
.particle.purple{background:radial-gradient(circle,#b04de0,transparent);box-shadow:0 0 6px #b04de0}
.particle.blue{background:radial-gradient(circle,#4d8de0,transparent);box-shadow:0 0 6px #4d8de0}
.particle.red{background:radial-gradient(circle,#e04343,transparent);box-shadow:0 0 6px #e04343}
.particle.white{background:radial-gradient(circle,#fff,transparent);box-shadow:0 0 10px #fff}
.particle.divine{background:radial-gradient(circle,#f5d98e,#c9a84c);box-shadow:0 0 12px #f5d98e}
.particle.combat{background:radial-gradient(circle,#ff6b6b,transparent);box-shadow:0 0 6px #ff4444}
.particle.loot{background:radial-gradient(circle,#fff,transparent);box-shadow:0 0 10px #fff}
@keyframes drift{
  0%{opacity:0;transform:translateY(0) scale(0)}
  20%{opacity:1}
  80%{opacity:1}
  100%{opacity:0;transform:translateY(-300px) scale(1.5)}
}

/* ===== 主容器 ===== */
#game{
  position:relative;z-index:1;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
}

/* ===== 顶部HUD ===== */
#hud{
  padding:8px 12px 4px;
  display:flex;justify-content:space-between;align-items:flex-start;
  z-index:10;flex-wrap:wrap;gap:4px;
}
#stage-badge{
  background:linear-gradient(135deg,rgba(201,168,76,0.15),rgba(201,168,76,0.05));
  border:1px solid rgba(201,168,76,0.3);
  border-radius:20px;padding:4px 12px;
  font-family:'STKaiti','KaiTi',serif;font-size:0.85em;color:var(--gold);letter-spacing:1px;
}
#realm-badge{
  font-family:'STKaiti','KaiTi',serif;font-size:1em;color:var(--gold);letter-spacing:1px;
}
#qi-badge{
  display:flex;align-items:center;gap:4px;
  font-size:0.8em;color:var(--text-dim)
}
#qi-badge .val{color:var(--gold-bright);font-weight:bold;min-width:50px;text-align:right}

/* 灵根指示器 */
#linggen-indicator{
  font-size:0.75em;padding:2px 8px;border-radius:10px;
  border:1px solid rgba(255,255,255,0.15);
  display:none;
}

/* ===== 中央战斗区 ===== */
#battle-zone{
  flex:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}

/* 角色 */
#character{
  position:relative;
  transition:transform 0.3s;
  cursor:pointer;
}
#character.hit{animation:charShake 0.3s ease}
#character.crit{animation:charPulse 0.5s ease}
@keyframes charShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes charPulse{0%{transform:scale(1)}50%{transform:scale(1.15);filter:brightness(2)}100%{transform:scale(1)}}

#char-body{
  border-radius:50%;
  margin:0 auto;
  animation:breathe 3s ease-in-out infinite;
  transition: width 1s, height 1s, box-shadow 1s, background 1s;
}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

#char-robe{
  border-radius:40px 40px 10px 10px;
  margin:-10px auto 0;
  position:relative;z-index:-1;
  transition: width 1s, background 1s;
}

/* 光环 */
#aura{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  border-radius:50%;
  animation:auraSpin 10s linear infinite;
  pointer-events:none;
  transition: width 1s, height 1s, border-color 1s, box-shadow 1s;
}
@keyframes auraSpin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}

/* 敌人 */
#enemy-zone{
  position:absolute;top:15%;left:50%;transform:translateX(-50%);
  text-align:center;
  opacity:0;transition:opacity 0.5s,transform 0.5s;
  transform:translateX(-50%) translateY(20px);
}
#enemy-zone.active{opacity:1;transform:translateX(-50%) translateY(0)}
#enemy-name{font-family:'STKaiti','KaiTi',serif;color:var(--danger);font-size:1.1em;margin-bottom:4px}
#enemy-hp-bar{width:140px;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;margin:4px auto}
#enemy-hp-fill{height:100%;background:linear-gradient(90deg,#e04343,#ff6b6b);transition:width 0.15s;border-radius:4px}
#enemy-sprite{font-size:3em;animation:enemyFloat 2s ease-in-out infinite}
@keyframes enemyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* 技能按钮 — 固定于视口，高于所有面板 */
#skill-btn{
  position:fixed;bottom:140px;right:16px;
  width:56px;height:56px;border-radius:50%;
  border:2px solid rgba(201,168,76,0.4);
  background:radial-gradient(circle,rgba(201,168,76,0.3),rgba(139,105,20,0.2));
  color:var(--gold-bright);font-size:1.5em;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.2s;
  z-index:30;
}
#skill-btn:active{background:rgba(201,168,76,0.5);transform:scale(0.9)}
#skill-btn.cooldown{opacity:0.4;pointer-events:none}
#skill-cd-text{position:absolute;font-size:0.5em;color:var(--gold-bright)}

/* ===== 经验条 ===== */
#exp-bar-wrap{
  width:80%;max-width:350px;margin:0 auto;
  height:10px;background:rgba(255,255,255,0.06);border-radius:5px;overflow:hidden;
}
#exp-bar-fill{
  height:100%;background:linear-gradient(90deg,#3a6bc5,#6ba0ff);
  border-radius:5px;transition:width 0.3s;
}
#exp-text{text-align:center;font-size:0.7em;color:var(--text-dim);margin:4px 0 6px}

/* ===== 解锁提示条 ===== */
#unlock-bar{
  text-align:center;font-size:0.7em;color:var(--text-dim);margin:2px 0 4px;
  min-height:16px;
}
#unlock-bar .new{color:var(--jade);animation:pulseNew 1.5s ease-in-out infinite}
@keyframes pulseNew{0%,100%{opacity:0.6}50%{opacity:1}}

/* ===== 底部标签栏 ===== */
#tabs{
  display:flex;padding:0 12px 6px;gap:6px;z-index:10;
}
.tab{
  flex:1;padding:8px 0;text-align:center;
  background:rgba(255,255,255,0.03);border-radius:8px;
  font-size:0.8em;color:var(--text-dim);
  cursor:pointer;transition:all 0.2s;
  border:1px solid transparent;
  position:relative;
}
.tab.active{color:var(--gold);border-color:rgba(201,168,76,0.3);background:rgba(201,168,76,0.08)}
.tab .badge{
  position:absolute;top:-6px;right:-6px;
  background:var(--danger);color:#fff;font-size:0.65em;
  border-radius:8px;padding:1px 5px;display:none;
}

/* ===== 面板 ===== */
#panels{
  position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(180deg,rgba(6,6,14,0.95),rgba(6,6,14,1));
  border-top:1px solid rgba(255,255,255,0.06);
  z-index:20;
  max-height:60vh;
  overflow-y:auto;
  transform:translateY(100%);
  transition:transform 0.3s ease;
  border-radius:16px 16px 0 0;
  padding:16px 16px max(16px,env(safe-area-inset-bottom));
}
#panels.open{transform:translateY(0)}
#panels-close{
  width:40px;height:4px;background:rgba(255,255,255,0.15);
  border-radius:2px;margin:0 auto 12px;cursor:pointer;
}

/* 功法/装备卡 */
.skill-card{
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;padding:10px 14px;margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:center;
}
.skill-card.locked{opacity:0.35}
.skill-info h4{color:var(--text);font-size:0.85em;font-family:'STKaiti','KaiTi',serif}
.skill-info p{color:var(--text-dim);font-size:0.7em;margin-top:2px}
.skill-btn{
  padding:4px 14px;border-radius:14px;border:1px solid var(--jade);
  background:transparent;color:var(--jade);font-size:0.75em;
  cursor:pointer;white-space:nowrap;
}
.skill-btn.owned{border-color:var(--text-dim);color:var(--text-dim)}
.skill-btn:active:not(.owned){background:rgba(77,184,141,0.15)}
.skill-btn.enhance{border-color:#e0a800;color:#e0a800}

.equip-card{
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;padding:10px 14px;margin-bottom:6px;
  display:flex;align-items:center;gap:10px;
}
.equip-icon{font-size:1.6em;width:36px;text-align:center}
.equip-info{flex:1}
.equip-name{font-size:0.8em;font-weight:bold;font-family:'STKaiti','KaiTi',serif}
.equip-stat{font-size:0.68em;color:var(--text-dim)}
.equip-empty{color:var(--text-dim);font-size:0.75em;text-align:center;padding:12px}
.equip-enhance{font-size:0.65em;margin-top:2px}
.rarity-common{color:var(--rarity-common)}.rarity-uncommon{color:var(--rarity-uncommon)}
.rarity-rare{color:var(--rarity-rare)}.rarity-epic{color:var(--rarity-epic)}
.rarity-legendary{color:var(--rarity-legendary)}.rarity-mythic{color:var(--rarity-mythic)}

/* 灵根选择卡 */
.linggen-card{
  background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.08);
  border-radius:12px;padding:14px;text-align:center;cursor:pointer;
  transition:all 0.2s;margin-bottom:8px;
}
.linggen-card:active{transform:scale(0.96)}
.linggen-card .lg-icon{font-size:2em;margin-bottom:4px}
.linggen-card .lg-name{font-family:'STKaiti','KaiTi',serif;font-size:0.95em;font-weight:bold}
.linggen-card .lg-desc{font-size:0.7em;color:var(--text-dim);margin-top:2px}

/* ===== 突破覆盖层 ===== */
#bt-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.9);
  z-index:100;display:none;
  flex-direction:column;align-items:center;justify-content:center;
}
#bt-overlay.active{display:flex}
#bt-lightning{
  position:absolute;top:0;left:0;right:0;bottom:0;
  pointer-events:none;
}
.lightning-flash{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:rgba(255,255,255,0);
  animation:flashBurst 0.6s ease-out forwards;
}
@keyframes flashBurst{
  0%{background:rgba(255,255,255,0.7)}
  100%{background:rgba(255,255,255,0)}
}
#bt-tension-bar-wrap{
  width:200px;height:8px;background:rgba(255,255,255,0.1);
  border-radius:4px;overflow:hidden;margin:16px 0;
}
#bt-tension-fill{
  height:100%;width:0%;background:var(--gold);
  border-radius:4px;transition:width 0.05s linear;
}
#bt-zone-indicator{
  position:relative;width:200px;height:8px;margin-top:-12px;
}
.bt-success-zone{
  position:absolute;top:-16px;height:24px;
  background:rgba(77,184,141,0.3);border-radius:4px;
  border:1px dashed rgba(77,184,141,0.6);
}
#bt-result{font-family:'STKaiti','KaiTi',serif;font-size:1.6em;margin:12px 0;text-align:center;min-height:40px}
#bt-btn-overlay{
  padding:12px 40px;border-radius:24px;border:2px solid var(--gold);
  background:rgba(201,168,76,0.2);color:var(--gold-bright);
  font-family:'STKaiti','KaiTi',serif;font-size:1em;cursor:pointer;
}
#bt-close{color:var(--text-dim);margin-top:16px;cursor:pointer;font-size:0.85em}

/* ===== 随机事件弹窗 ===== */
#event-popup{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.9);
  background:rgba(10,10,24,0.97);border:1px solid rgba(201,168,76,0.4);
  border-radius:16px;padding:24px;z-index:80;
  max-width:320px;width:90%;text-align:center;
  display:none;opacity:0;transition:opacity 0.3s,transform 0.3s;
  box-shadow:0 0 60px rgba(0,0,0,0.6);
}
#event-popup.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1)}
#event-icon{font-size:3em;margin-bottom:8px}
#event-title{font-family:'STKaiti','KaiTi',serif;color:var(--gold);font-size:1.1em;margin-bottom:4px}
#event-desc{font-size:0.85em;color:var(--text-dim);margin-bottom:16px;line-height:1.5}
.event-cho{
  display:block;width:100%;padding:10px;margin-bottom:8px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;color:var(--text);font-size:0.85em;cursor:pointer;text-align:left;
  transition:all 0.15s;
}
.event-cho:active{background:rgba(201,168,76,0.1);border-color:rgba(201,168,76,0.3)}

/* ===== 掉落通知 ===== */
.loot-toast{
  position:fixed;top:10%;left:50%;transform:translateX(-50%);
  padding:10px 20px;border-radius:20px;
  font-family:'STKaiti','KaiTi',serif;font-size:0.9em;
  z-index:90;pointer-events:none;
  animation:lootFly 2s ease-out forwards;
  white-space:nowrap;
}
@keyframes lootFly{
  0%{opacity:0;transform:translateX(-50%) translateY(20px)}
  15%{opacity:1;transform:translateX(-50%) translateY(0)}
  75%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) translateY(-40px)}
}
.loot-toast.common{background:rgba(80,80,80,0.9);color:#ccc}
.loot-toast.uncommon{background:rgba(40,100,70,0.9);color:#7fd4b3}
.loot-toast.rare{background:rgba(30,60,120,0.9);color:#7db8ff}
.loot-toast.epic{background:rgba(80,30,120,0.9);color:#c97dff}
.loot-toast.legendary{background:rgba(120,90,0,0.95);color:#ffd700;box-shadow:0 0 20px rgba(255,215,0,0.5)}
.loot-toast.mythic{background:rgba(160,30,30,0.95);color:#ff6666;box-shadow:0 0 25px rgba(255,60,60,0.6)}

/* ===== 灵根觉醒覆盖层 ===== */
#lg-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.92);
  z-index:110;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  padding:20px;
}
#lg-overlay.active{display:flex}
#lg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:340px;width:100%;margin-top:16px}

/* ===== 响应式 ===== */
@media(max-width:380px){
  #char-body{width:45px!important;height:45px!important}
  #char-robe{width:55px!important}
  #enemy-sprite{font-size:2.5em}
}
@media(min-width:768px){
  #battle-zone{max-width:500px;margin:0 auto}
}
</style>
</head>
<body>

<!-- 粒子背景 -->
<div id="particles"></div>

<!-- 突破覆盖层 -->
<div id="bt-overlay">
  <div id="bt-lightning"></div>
  <div style="font-family:STKaiti,KaiTi,serif;color:var(--gold);font-size:1.2em;margin-bottom:4px" id="bt-realm-label"></div>
  <div style="color:var(--text-dim);font-size:0.8em;margin-bottom:4px" id="bt-stage-label"></div>
  <div style="color:var(--text-dim);font-size:0.75em;margin-bottom:8px" id="bt-chance-label"></div>
  <div id="bt-tension-bar-wrap"><div id="bt-tension-fill"></div></div>
  <div id="bt-zone-indicator"><div class="bt-success-zone" id="bt-success-zone"></div></div>
  <div id="bt-result"></div>
  <button id="bt-btn-overlay" onclick="triggerBreakthrough()">引动天劫</button>
  <div id="bt-close" onclick="closeBreakthrough()">放弃突破</div>
</div>

<!-- 灵根觉醒覆盖层 -->
<div id="lg-overlay">
  <div style="font-family:STKaiti,KaiTi,serif;color:#c9a84c;font-size:1.3em">🌟 灵根觉醒</div>
  <div style="color:var(--text-dim);font-size:0.8em;margin-top:8px;text-align:center">金丹已成，灵根觉醒！<br>选择一种灵根，将永久改变修炼之路</div>
  <div id="lg-grid"></div>
</div>

<!-- 随机事件 -->
<div id="event-popup">
  <div id="event-icon"></div>
  <div id="event-title"></div>
  <div id="event-desc"></div>
  <div id="event-choices"></div>
</div>

<!-- 游戏主体 -->
<div id="game">
  <!-- HUD -->
  <div id="hud">
    <div><span id="stage-badge">凡人</span> <span id="realm-badge"></span></div>
    <div style="display:flex;align-items:center;gap:6px">
      <span id="linggen-indicator"></span>
      <span id="prestige-indicator" style="display:none;font-size:0.7em;color:#f5d98e"></span>
      <span id="qi-badge">✦ <span class="val" id="qi-val">0</span></span>
    </div>
  </div>

  <!-- 解锁提示 -->
  <div id="unlock-bar"></div>

  <!-- 战斗区 -->
  <div id="battle-zone">
    <div id="aura"></div>
    <div id="character" onclick="manualAttack()">
      <div id="char-body"></div>
      <div id="char-robe"></div>
    </div>
    <div id="enemy-zone">
      <div id="enemy-sprite">👹</div>
      <div id="enemy-name"></div>
      <div id="enemy-hp-bar"><div id="enemy-hp-fill"></div></div>
    </div>
  </div>

  <!-- 经验条 -->
  <div id="exp-bar-wrap"><div id="exp-bar-fill" style="width:0%"></div></div>
  <div id="exp-text">修炼进度 0 / 100</div>

  <!-- 功法修炼条 -->
  <div id="cult-bar-wrap" style="width:80%;max-width:350px;margin:0 auto 4px;height:6px;background:rgba(255,255,255,0.04);border-radius:3px;overflow:hidden">
    <div id="cult-bar-fill" style="height:100%;background:linear-gradient(90deg,#e0a800,#c9a84c);border-radius:3px;width:0%;transition:width 0.5s"></div>
  </div>
  <div id="cult-text" style="text-align:center;font-size:0.65em;color:var(--text-dim);margin-bottom:4px"></div>

  <!-- 标签栏 -->
  <div id="tabs">
    <div class="tab active" onclick="openPanel('skills')">功法</div>
    <div class="tab" onclick="openPanel('equip')">装备<span class="badge" id="equip-badge">!</span></div>
    <div class="tab" onclick="openPanel('bt')">突破</div>
    <div class="tab" onclick="openPanel('shentong')">神通</div>
    <div class="tab" onclick="openPanel('stats')">统计</div>
  </div>
</div>

<!-- 面板 -->
<div id="panels">
  <div id="panels-close" onclick="closePanel()"></div>
  <div id="panel-content"></div>
</div>


<!-- 技能按钮 — 在body层，高于所有面板 -->
<div id="skill-btn" onclick="useSkill()">⚡</div>

<script>
// ============================================================
// 仙途 · 放置修仙 v0.3 — 大境界质变版
// 新增: 大境界解锁 · 灵根觉醒 · 装备强化 · 神通树 · 转世
// ============================================================

// ===== 大境界分组 =====
const STAGES = [
  {id:0, name:'凡人境',   color:'#888',    aura:'rgba(150,150,150,0.1)',  ptype:'qi'},
  {id:1, name:'练气境',   color:'#c9a84c', aura:'rgba(201,168,76,0.15)', ptype:'qi',    unlock:'战斗系统开启'},

function triggerRareDrop(){
  let slot=['weapon','armor','accessory'][randInt(0,2)];
  let pool=EQUIP_POOL[slot];
  let r=Math.random()<0.3?'legendary':'epic';
  let candidates=pool.filter(x=>x.r===r);
  if(candidates.length===0)candidates=pool.filter(x=>x.r==='rare');
  let item=candidates[randInt(0,candidates.length-1)];
  S.equip[slot]={n:item.n,r:item.r,a:item.a||0,d:item.d||0,q:item.q||0,enhance:0};
  showLootToast({n:item.n,r:item.r,a:item.a,d:item.d,q:item.q},slot);
}

function loadState(){
  try{
    let raw=localStorage.getItem('xx2_save');
    if(!raw)return DEF();
    let r=JSON.parse(raw);
    let merged={...DEF(),...r};
    if(typeof merged.realm!=='number'||typeof merged.qi!=='number')throw new Error('存档损坏');
    // 向后兼容: 如果旧存档装备没有enhance字段
    for(let k of ['weapon','armor','accessory']){
      if(merged.equip[k]&&typeof merged.equip[k].enhance!=='number')merged.equip[k].enhance=0;
    }
    return merged;
  }catch(e){
    console.warn('存档读取失败:',e.message);
    localStorage.removeItem('xx2_save');
    return DEF();
  }
}
function save(){S.lastSave=Date.now();try{localStorage.setItem('xx2_save',JSON.stringify(S))}catch(e){console.warn('存档失败:',e)}}
function getRealm(){return REALMS[S.realm]}
function getStage(){return STAGES[getRealm().stage]}
function getNext(){return REALMS[S.realm+1]||null}
function fmt(n){return n>=1e8?(n/1e8).toFixed(2)+'亿':n>=1e5?(n/1e4).toFixed(1)+'万':n>=1e4?(n/1e4).toFixed(2)+'万':Math.floor(n).toLocaleString()}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}

// ===== 灵根加成计算 =====
function linggenBonus(type){
  if(!S.linggen||S.linggen!==type)return 0;
  return (LINGGEN[S.linggen].bonus[type]||0);
}

// ===== 核心计算 =====
function qiMult(){
  let m=1;
  for(let id of S.skills){let s=SKILLS.find(x=>x.id===id);if(s&&s.e.t==='qi')m+=s.e.v}
  for(let id of S.shentong){let st=SHENTONG.find(x=>x.id===id);if(st&&st.e.t==='qi')m+=st.e.v}
  m+=linggenBonus('qi');
  m+=S.prestigeBonus;
  m*=(1+linggenBonus('speed'));
  return m;
}
function clickMult(){
  let m=1;
  for(let id of S.skills){let s=SKILLS.find(x=>x.id===id);if(s&&s.e.t==='click')m+=s.e.v}
  return m;
}
function btBonus(){
  let b=0;
  for(let id of S.skills){let s=SKILLS.find(x=>x.id===id);if(s&&s.e.t==='bt')b+=s.e.v}
  b+=linggenBonus('bt');
  return b;
}
function getAtk(){
  let a=getRealm().atk;
  if(S.equip.weapon)a+=Math.floor((S.equip.weapon.a||0)*(1+S.equip.weapon.enhance*0.15));
  if(S.equip.armor)a+=Math.floor(((S.equip.armor.d||0)*(1+S.equip.armor.enhance*0.1))*0.3);
  a=Math.floor(a*(1+linggenBonus('atk')));
  if(S.shentong.includes('st2'))a=Math.floor(a*1.25);
  return a;
}
function getDef(){
  let d=0;
  if(S.equip.armor)d+=Math.floor((S.equip.armor.d||0)*(1+S.equip.armor.enhance*0.1));
  d=Math.floor(d*(1+linggenBonus('def')));
  return d;
}
function getCritChance(){return linggenBonus('crit')}
function getSkillCD(){return 5*(1-linggenBonus('cd'))}
function canBT(){
  let r=getRealm(),n=getNext();
  if(!n)return false;
  if(S.exp<r.exp)return false;
  let cost=Math.floor(r.cost*(1-linggenBonus('bcost')));
  if(S.qi<cost)return false;
  return true;
}
function getCultTarget(){return Math.floor(getRealm().exp*0.8)}
function getCultName(){return getRealm().n+'真解'}
function isCultComplete(){return S.cultivation>=getCultTarget()}
function cultBonus(){return isCultComplete()?0.10:0}
function accelerateCultivation(){
  let cost=Math.floor(getCultTarget()*0.05);
  if(S.qi<cost){showToast('灵力不足，需要 '+fmt(cost)+' 灵力');return}
  S.qi-=cost;
  let boost=Math.floor(getCultTarget()*0.15+randInt(0,Math.floor(getCultTarget()*0.05)));
  S.cultivation=Math.min(getCultTarget(),S.cultivation+boost);
  showToast('📖 参悟 '+getCultName()+' +'+fmt(boost));
  save();refreshAll();
}
function btChance(){return Math.min(0.95,getRealm().bt+btBonus()+cultBonus())}

// ===== 敌人系统 =====
function spawnEnemy(){
  if(S.enemy)return;
  let pool=ENEMIES.filter(e=>e.minR<=S.realm);
  let t=pool[Math.min(pool.length-1,Math.floor(Math.random()*Math.min(pool.length,S.realm+3)))];
  let hpMult=1+S.realm*0.05;
  S.enemy={...t,hp:Math.floor(t.hp*hpMult),maxHp:Math.floor(t.hp*hpMult)};
  S.enemyTimer=0;
  let ez=document.getElementById('enemy-zone');
  document.getElementById('enemy-sprite').textContent=t.e;
  document.getElementById('enemy-name').textContent=t.n;
  document.getElementById('enemy-hp-fill').style.width='100%';
  ez.classList.add('active');
}
function attackEnemy(dmg){
  if(!S.enemy)return;
  // 暴击判定
  let isCrit=Math.random()<getCritChance();
  if(isCrit)dmg=Math.floor(dmg*2);
  S.enemy.hp-=dmg;
  let pct=Math.max(0,(S.enemy.hp/S.enemy.maxHp)*100);
  document.getElementById('enemy-hp-fill').style.width=pct+'%';
  spawnCombatParticles(window.innerWidth/2,window.innerHeight*0.25,isCrit?8:3);
  if(isCrit)showToast('💥 暴击！'+fmt(dmg)+'伤害');
  if(S.enemy.hp<=0)killEnemy();
}
function killEnemy(){
  let e=S.enemy;
  S.qi+=e.qi;
  S.totalQi+=e.qi;
  S.exp+=Math.floor(e.qi*1.2);
  spawnQiParticles(15);
  // 掉落判定
  let dropChance=0.25*(1+linggenBonus('drop'));
  if(S.shentong.includes('st4'))dropChance+=0.5;
  if(Math.random()<dropChance){
    let slot=['weapon','armor','accessory'][randInt(0,2)];
    let pool=EQUIP_POOL[slot];
    let r=rollRarity();
    let candidates=pool.filter(x=>x.r===r);
    if(candidates.length===0)candidates=pool.filter(x=>x.r==='common');
    let item=candidates[randInt(0,candidates.length-1)];
    // 比较新旧装备
    let old=S.equip[slot];
    let isUpgrade=false;
    if(!old)isUpgrade=true;
    else{
      let oldVal=old.a||old.d||(old.q*100)||0;
      let newVal=item.a||item.d||(item.q*100)||0;
      isUpgrade=newVal>oldVal;
    }
    if(isUpgrade){
      S.equip[slot]={n:item.n,r:item.r,a:item.a||0,d:item.d||0,q:item.q||0,enhance:0};
      showLootToast(item,slot);
    }
    // 如果不如当前装备，不替换但给灵力补偿
  }
  document.getElementById('enemy-zone').classList.remove('active');
  S.enemy=null;
}
function rollRarity(){
  let r=Math.random()*100;let acc=0;
  for(let[k,v]of Object.entries(RARITY_WEIGHTS)){acc+=v;if(r<=acc)return k}
  return 'common';
}
function manualAttack(){
  if(S.enemy){
    let dmg=Math.floor(getAtk()*0.6*clickMult());
    attackEnemy(dmg);
    let c=document.getElementById('character');
    c.classList.remove('crit');void c.offsetWidth;c.classList.add('crit');
  }else{
    let g=Math.floor(getRealm().qi*3*clickMult());
    S.qi+=g;S.totalQi+=g;S.exp+=g;
    spawnQiParticles(6);
    document.getElementById('character').classList.add('crit');
    setTimeout(()=>document.getElementById('character').classList.remove('crit'),500);
  }
  refreshHUD();
}
function useSkill(){
  if(S.skillCD>0||!S.enemy)return;
  let dmg=Math.floor(getAtk()*3*clickMult());
  attackEnemy(dmg);
  spawnCombatParticles(window.innerWidth/2,window.innerHeight*0.25,12);
  S.skillCD=getSkillCD();
  document.getElementById('skill-btn').classList.add('cooldown');
  let cd=document.getElementById('skill-btn');
  if(!cd.querySelector('#skill-cd-text'))cd.innerHTML='⚡<span id="skill-cd-text"></span>';
}

// ===== 突破系统 =====
function openBreakthrough(){
  if(!canBT()){showToast('修炼未满或灵力不足');return}
  let ov=document.getElementById('bt-overlay');
  document.getElementById('bt-realm-label').textContent=getRealm().n+' → '+getNext().n;
  document.getElementById('bt-stage-label').textContent=getStage().name+' → '+(STAGES[getNext().stage]||{}).name||'';
  let cost=Math.floor(getRealm().cost*(1-linggenBonus('bcost')));
  document.getElementById('bt-chance-label').textContent='成功率: '+Math.floor(btChance()*100)+'% | 消耗: '+fmt(cost)+' 灵力';
  document.getElementById('bt-result').textContent='';
  document.getElementById('bt-tension-fill').style.width='0%';
  document.getElementById('bt-btn-overlay').style.display='';
  document.getElementById('bt-close').style.display='';
  let z=document.getElementById('bt-success-zone');
  let chance=btChance();
  z.style.left=(100-chance*100)+'%';
  z.style.width=(chance*100)+'%';
  ov.classList.add('active');
  closePanel();
}
function triggerBreakthrough(){
  let ov=document.getElementById('bt-overlay');
  document.getElementById('bt-btn-overlay').style.display='none';
  document.getElementById('bt-close').style.display='none';
  let ln=document.getElementById('bt-lightning');
  let flashI=setInterval(()=>{
    let f=document.createElement('div');f.className='lightning-flash';
    ln.appendChild(f);setTimeout(()=>f.remove(),600);
  },400);
  let bar=document.getElementById('bt-tension-fill');
  let pos=0,direction=1,speed=2+Math.random()*4;
  let barI=setInterval(()=>{
    pos+=direction*speed;
    if(pos>=100){direction=-1;speed=1+Math.random()*3}
    if(pos<=0){direction=1;speed=1+Math.random()*3}
    bar.style.width=pos+'%';
  },50);
  setTimeout(()=>{
    clearInterval(flashI);clearInterval(barI);
    let finalPos=parseFloat(bar.style.width)||50;
    let chance=btChance();
    let success=finalPos/100 <= chance;
    let cost=Math.floor(getRealm().cost*(1-linggenBonus('bcost')));
    S.qi=Math.max(0,S.qi-cost);
    let oldStage=getRealm().stage;
    if(success){
      S.realm++;S.exp=0;S.btCount++;S.cultivation=0;S.cultivation=0;
      let newStage=getRealm().stage;
      S.btHistory.unshift({r:getRealm().n,ok:true,ts:Date.now()});
      document.getElementById('bt-result').innerHTML='<span style="color:#4db88d">✨ 突破成功！</span><br><span style="font-size:0.7em;color:#c9a84c">晋升 '+getRealm().n+'</span>';
      document.getElementById('bt-result').style.color='#4db88d';
      // 大境界突破特效
      if(newStage>oldStage){
        doStageBreakthrough(newStage);
      }
      // 粒子雨
      for(let i=0;i<30;i++)setTimeout(()=>{
        let p=document.createElement('div');p.className='particle '+getStage().ptype;
        p.style.left=randInt(0,window.innerWidth)+'px';p.style.top=randInt(0,window.innerHeight)+'px';
        p.style.width=randInt(4,12)+'px';p.style.height=p.style.width;
        p.style.animationDuration=(1.5+Math.random()*2)+'s';
        document.getElementById('bt-lightning').appendChild(p);
        setTimeout(()=>p.remove(),3000);
      },i*40);
    }else{
      S.exp=Math.floor(S.exp*0.75);
      S.btHistory.unshift({r:getNext().n,ok:false,ts:Date.now()});
      document.getElementById('bt-result').innerHTML='<span style="color:#e04343">💔 突破失败</span><br><span style="font-size:0.7em;color:#5c5c70">修为倒退25%</span>';
      document.getElementById('bt-result').style.color='#e04343';
    }
    if(S.btHistory.length>20)S.btHistory=S.btHistory.slice(0,20);
    save();refreshAll();
    setTimeout(()=>{document.getElementById('bt-result').textContent=''},3000);
  },3000);
}
function closeBreakthrough(){
  document.getElementById('bt-overlay').classList.remove('active');
}

// ===== 随机事件 =====
let currentEvent=null;
function triggerEvent(){
  if(currentEvent)return;
  let pool=EVENTS.filter(e=>!e.minR||e.minR<=S.realm);
  let ev=pool[randInt(0,pool.length-1)];
  currentEvent=ev;
  document.getElementById('event-icon').textContent=ev.icon;
  document.getElementById('event-title').textContent=ev.t;
  document.getElementById('event-desc').textContent=ev.d;
  let choHtml='';
  ev.ch.forEach((c,i)=>{
    let disabled='';
    if(c.e!=='1'){
      try{if(!eval(c.e))disabled='disabled style="opacity:0.4"'}catch(e){}
    }
    choHtml+=`<button class="event-cho" ${disabled} onclick="resolveEvent(${i})">${c.t}</button>`;
  });
  document.getElementById('event-choices').innerHTML=choHtml;
  document.getElementById('event-popup').classList.add('show');
  closePanel();
}
function resolveEvent(idx){
  let ev=currentEvent;
  if(!ev||!ev.ch[idx])return;
  document.getElementById('event-popup').classList.remove('show');
  try{
    let result=ev.ch[idx].act();
    showToast(result);
  }catch(e){
    console.error('事件处理错误:',e);
    showToast('事件处理出错，但不影响游戏');
  }
  currentEvent=null;
  save();refreshAll();
}
window.resolveEvent=resolveEvent;

// ===== 装备强化 =====
function enhanceEquip(slot){
  let item=S.equip[slot];
  if(!item)return;
  let lv=item.enhance||0;
  if(lv>=15){showToast('已达最高强化等级 +15');return}
  let cost=enhanceCost(lv);
  if(S.qi<cost){showToast('灵力不足，需要 '+fmt(cost)+' 灵力');return}
  S.qi-=cost;
  let chance=enhanceChance(lv);
  if(Math.random()<chance){
    item.enhance=lv+1;
    showToast('✨ '+RARITY_NAMES[item.r]+' '+item.n+' 强化成功 → +'+item.enhance);
    if(item.enhance>=10)spawnQiParticles(20);
  }else{
    if(lv>=10&&Math.random()<0.3){
      // 爆装
      S.equip[slot]=null;
      showToast('💔 强化失败！装备破碎...');
    }else if(lv>0){
      item.enhance=lv-1;
      showToast('强化失败，掉至 +'+(lv-1));
    }else{
      showToast('强化失败，但等级不变');
    }
  }
  save();refreshAll();
}
window.enhanceEquip=enhanceEquip;

// ===== 游戏主循环 =====
let _autoAttackTimer=0;
let _enemySpawnThreshold=4+Math.random()*4;
let _cloneTimer=0;
function tick(){
  // 自动修炼
  let qiGain=getRealm().qi*qiMult();
  S.qi+=qiGain;S.totalQi+=qiGain;S.exp+=qiGain;
  // 功法修炼
  S.cultivation=Math.min(getCultTarget(),S.cultivation+qiGain*0.3);
  // 技能CD
  if(S.skillCD>0){S.skillCD-=0.1;if(S.skillCD<=0){S.skillCD=0;let sb=document.getElementById('skill-btn');if(sb)sb.classList.remove('cooldown')}}
  // 敌人逻辑
  if(S.enemy){
    _autoAttackTimer+=0.1;
    let aspd=1.5;
    if(S.shentong.includes('st1'))aspd*=0.6;
    if(_autoAttackTimer>=aspd){_autoAttackTimer=0;attackEnemy(Math.floor(getAtk()*0.5))}
    // 分身攻击
    if(S.shentong.includes('st3')){
      _cloneTimer+=0.1;
      if(_cloneTimer>=aspd*1.5){_cloneTimer=0;attackEnemy(Math.floor(getAtk()*0.3))}
    }
  }else{
    S.enemyTimer+=0.1;
    if(S.enemyTimer>_enemySpawnThreshold){S.enemyTimer=0;_enemySpawnThreshold=4+Math.random()*4;spawnEnemy()}
  }
  // 随机事件
  S.eventTimer+=0.1;
  if(S.eventTimer>30+Math.random()*40&&!currentEvent){S.eventTimer=0;triggerEvent()}
  // 粒子
  if(Math.random()<0.4)spawnQiParticles(2);
  // UI更新
  refreshHUD();
  // 自动保存
  if(Math.floor(Date.now()/10000)!==Math.floor((Date.now()-100)/10000))save();
}

  document.getElementById('exp-bar-fill').style.width=pct+'%';
  document.getElementById('exp-text').textContent=r.exp===Infinity?'已达仙道巅峰 · 可飞升转世':'修炼进度 '+fmt(S.exp)+' / '+fmt(r.exp);
  let ct=getCultTarget(),cv=S.cultivation,cpct=Math.min(100,Math.floor(cv/ct*100));document.getElementById('cult-bar-fill').style.width=cpct+'%';document.getElementById('cult-bar-fill').style.background=cpct>=100?'linear-gradient(90deg,#4db88d,#7fd4b3)':'linear-gradient(90deg,#e0a800,#c9a84c)';document.getElementById('cult-text').textContent=cpct>=100?'\📖 '+getCultName()+' \✅ 已参悟 (突破率+5%)':'\📖 '+getCultName()+' '+fmt(cv)+'/'+fmt(ct);
}
function refreshSkillCD(){
  let btn=document.getElementById('skill-btn');
  let cdEl=btn.querySelector('#skill-cd-text');
  if(S.skillCD>0){
    if(!cdEl){btn.innerHTML='⚡<span id="skill-cd-text"></span>';cdEl=btn.querySelector('#skill-cd-text')}
    cdEl.textContent=Math.ceil(S.skillCD)+'s';
  }else if(cdEl){cdEl.textContent=''}
}
function openPanel(tab){
  currentPanel=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  let tabEls=document.querySelectorAll('.tab');
  let idx={skills:0,equip:1,bt:2,shentong:3,stats:4}[tab]||0;
  if(tabEls[idx])tabEls[idx].classList.add('active');
  refreshPanel();
  document.getElementById('panels').classList.add('open');
  panelsOpen=true;
  // 清除装备badge
  if(tab==='equip')document.getElementById('equip-badge').style.display='none';
}
function closePanel(){
  document.getElementById('panels').classList.remove('open');
  panelsOpen=false;
}
function refreshPanel(){
  let c=document.getElementById('panel-content');let h='';
  if(currentPanel==='skills'){
    SKILLS.forEach(s=>{
      let owned=S.skills.includes(s.id);
      let locked=s.minR>S.realm;
      let cls=locked?'locked':'';
      h+=`<div class="skill-card${locked?' locked':''}">
        <div class="skill-info"><h4>${s.n}${locked?' 🔒':''}</h4><p>${s.d} ${owned?'✅':''}${locked?' (境界不足)':''}</p></div>
        <button class="skill-btn${owned?' owned':''}" ${owned||locked?'disabled':''} onclick="buySkill('${s.id}')">${owned?'已习得':locked?'未解锁':'购买 '+fmt(s.c)+' 灵'}</button>
      </div>`;
    });
  }else if(currentPanel==='equip'){
    let slots=[{k:'weapon',n:'⚔️ 法宝'},{k:'armor',n:'🛡️ 护甲'},{k:'accessory',n:'💍 灵饰'}];
    slots.forEach(sl=>{
      let it=S.equip[sl.k];
      if(it){
        let stars='';
        for(let i=0;i<(it.enhance||0);i++)stars+='⭐';
        h+=`<div class="equip-card"><div class="equip-icon">${sl.n[0]+sl.n[1]}</div><div class="equip-info"><div class="equip-name ${'rarity-'+it.r}">${RARITY_NAMES[it.r]} · ${it.n}</div><div class="equip-stat">`;
        if(it.a)h+=`攻击+${Math.floor(it.a*(1+(it.enhance||0)*0.15))} `;
        if(it.d)h+=`防御+${Math.floor(it.d*(1+(it.enhance||0)*0.1))} `;
        if(it.q)h+=`灵力+${Math.floor(it.q*100)}%`;
        h+=`</div>${stars?`<div class="equip-enhance" style="color:#e0a800">${stars} +${it.enhance}</div>`:''}</div>`;
        // 强化按钮 (筑基解锁)
        if(S.realm>=10){
          let ecost=enhanceCost(it.enhance||0);
          let ech=Math.floor(enhanceChance(it.enhance||0)*100);
          h+=`<button class="skill-btn enhance" onclick="enhanceEquip('${sl.k}')" ${(it.enhance||0)>=15?'disabled':''}>${(it.enhance||0)>=15?'已满级':'强化 '+fmt(ecost)+'灵('+ech+'%)'}</button>`;
        }
        h+=`</div>`;
      }else{
        h+=`<div class="equip-card"><div class="equip-icon">${sl.n[0]+sl.n[1]}</div><div class="equip-info equip-empty">${sl.n} — 击败敌人有几率掉落</div></div>`;
      }
    });
    if(S.realm<10)h+='<div style="text-align:center;color:var(--text-dim);font-size:0.7em;margin-top:8px">🔒 装备强化在筑基境解锁</div>';
  }else if(currentPanel==='bt'){
    let n=getNext();
    if(n){
      let ch=Math.floor(btChance()*100);
      let cost=Math.floor(getRealm().cost*(1-linggenBonus('bcost')));
      let stName=(STAGES[n.stage]||{}).name||'';
      h+=`<div style="text-align:center;padding:12px"><div style="font-family:STKaiti,KaiTi,serif;font-size:1.1em;color:#c9a84c;margin-bottom:4px">${getRealm().n} → ${n.n}</div>
      <div style="color:#5c5c70;font-size:0.8em;margin-bottom:4px">大境界: ${getStage().name} → ${stName}</div>
      <div style="color:#5c5c70;font-size:0.8em;margin-bottom:4px">功法: ${getCultName()} ${isCultComplete()?'<span style="color:#4db88d">✅已参悟</span>':'<span style="color:#e0a800">参悟中...</span>'}</div>
      <div style="width:80%;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin:0 auto 8px"><div style="height:100%;background:${isCultComplete()?'#4db88d':'#e0a800'};border-radius:3px;width:${Math.min(100,Math.floor(S.cultivation/getCultTarget()*100))}%"></div></div>
      <div style="color:#5c5c70;font-size:0.7em;margin-bottom:4px">修炼进度 ${fmt(S.cultivation)} / ${fmt(getCultTarget())} ${isCultComplete()?'\✅ 突破率+5%':''}</div>
      <button style="padding:6px 18px;border-radius:12px;border:1px solid #e0a800;background:transparent;color:#e0a800;font-size:0.7em;cursor:pointer;margin-bottom:8px" onclick="accelerateCultivation()" ${isCultComplete()?'disabled':''}>📖 加速参悟</button>
      <div style="color:#5c5c70;font-size:0.8em;margin-bottom:4px">成功率: ${ch}%${cultBonus()>0?' <span style="color:#4db88d">(+5%功法加成)</span>':''} | 消耗: ${fmt(cost)} 灵力</div>
      <div style="color:#5c5c70;font-size:0.75em;margin-bottom:12px">${canBT()?'<span style="color:#4db88d">可以突破！</span>':'修炼未满或灵力不足'}</div>
      <button style="padding:10px 32px;border-radius:20px;border:2px solid #c9a84c;background:rgba(201,168,76,0.15);color:#f5d98e;font-family:STKaiti,KaiTi,serif;font-size:1em;cursor:pointer" ${canBT()?'':'disabled'} onclick="openBreakthrough()">冲击境界</button></div>`;
    }else{
      h+='<div style="text-align:center;padding:16px;color:#c9a84c">已达仙道巅峰</div>';
      h+=`<button style="display:block;margin:12px auto;padding:10px 32px;border-radius:20px;border:2px solid #f5d98e;background:rgba(245,217,142,0.15);color:#f5d98e;font-family:STKaiti,KaiTi,serif;font-size:1em;cursor:pointer" onclick="doPrestige()">✨ 飞升转世 (第${S.prestige+1}世)</button>`;
      h+=`<div style="text-align:center;color:var(--text-dim);font-size:0.7em">保留灵根 · 永久加成+${((S.prestige+1)*5).toFixed(0)}%</div>`;
    }
    if(S.btHistory.length>0){
      h+='<div style="margin-top:12px;max-height:150px;overflow-y:auto">';
      S.btHistory.slice(0,8).forEach(bh=>{
        h+=`<div style="font-size:0.75em;padding:4px 0;color:${bh.ok?'#4db88d':'#e04343'}">${bh.ok?'✅':'❌'} ${bh.r} — ${new Date(bh.ts).toLocaleDateString('zh-CN')}</div>`;
      });
      h+='</div>';
    }
  }else if(currentPanel==='shentong'){
    if(S.realm<16){
      h+='<div style="text-align:center;padding:20px;color:var(--text-dim)">🔒 元婴境解锁神通树</div>';
    }else{
      SHENTONG.forEach(st=>{
        let owned=S.shentong.includes(st.id);
        let locked=st.minR>S.realm;
        h+=`<div class="skill-card${locked?' locked':''}">
          <div class="skill-info"><h4>${st.icon} ${st.n}</h4><p>${st.d} ${owned?'✅':''}${locked?' (境界不足)':''}</p></div>
          <button class="skill-btn${owned?' owned':''}" ${owned||locked?'disabled':''} onclick="buyShentong('${st.id}')">${owned?'已领悟':locked?'未解锁':'领悟 '+fmt(st.c)+' 灵'}</button>
        </div>`;
      });
    }
  }else if(currentPanel==='stats'){
    let m=qiMult(),cm=clickMult();
    h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px">
      <div class="skill-card"><div><h4>大境界</h4><p style="color:${getStage().color}">${getStage().name}</p></div></div>
      <div class="skill-card"><div><h4>境界</h4><p>${getRealm().n}</p></div></div>
      <div class="skill-card"><div><h4>灵力</h4><p>${fmt(S.qi)}</p></div></div>
      <div class="skill-card"><div><h4>总灵力</h4><p>${fmt(S.totalQi)}</p></div></div>
      <div class="skill-card"><div><h4>灵根</h4><p>${S.linggen?LINGGEN[S.linggen].icon+' '+LINGGEN[S.linggen].n:'未觉醒'}</p></div></div>
      <div class="skill-card"><div><h4>转世</h4><p>第${S.prestige}世 (永久+${(S.prestigeBonus*100).toFixed(0)}%)</p></div></div>
      <div class="skill-card"><div><h4>攻击力</h4><p>${getAtk()}</p></div></div>
      <div class="skill-card"><div><h4>防御力</h4><p>${getDef()}</p></div></div>
      <div class="skill-card"><div><h4>暴击率</h4><p>${Math.floor(getCritChance()*100)}%</p></div></div>
      <div class="skill-card"><div><h4>突破次数</h4><p>${S.btCount}</p></div></div>
      <div class="skill-card"><div><h4>灵力倍率</h4><p>${m.toFixed(1)}x</p></div></div>
      <div class="skill-card"><div><h4>功法</h4><p>${S.skills.length}/${SKILLS.length}</p></div></div>
      <div class="skill-card"><div><h4>神通</h4><p>${S.shentong.length}/${SHENTONG.length}</p></div></div>
    </div>`;
    h+=`<div style="text-align:center;margin-top:12px"><button style="padding:8px 20px;border-radius:14px;border:1px solid #e04343;background:transparent;color:#e04343;font-size:0.8em;cursor:pointer" onclick="if(confirm('确定重置所有进度？')){localStorage.removeItem('xx2_save');location.reload()}">重置游戏</button></div>`;
  }
  c.innerHTML=h;
}

// ===== 购买 =====
function buySkill(id){
  if(S.skills.includes(id))return;
  let sk=SKILLS.find(s=>s.id===id);
  if(!sk)return;
  if(sk.minR>S.realm){showToast('境界不足');return}
  if(S.qi<sk.c){showToast('灵力不足');return}
  S.qi-=sk.c;S.skills.push(id);
  showToast('习得功法: '+sk.n);
  save();refreshAll();
}
function buyShentong(id){
  if(S.shentong.includes(id))return;
  let st=SHENTONG.find(s=>s.id===id);
  if(!st)return;
  if(st.minR>S.realm){showToast('境界不足');return}
  if(S.qi<st.c){showToast('灵力不足');return}
  S.qi-=st.c;S.shentong.push(id);
  showToast('领悟神通: '+st.icon+' '+st.n);
  save();refreshAll();
}
window.buySkill=buySkill;
window.buyShentong=buyShentong;

// ===== 通知 =====
function showLootToast(item,slot){
  let t=document.createElement('div');
  t.className='loot-toast '+item.r;
  let slotName={weapon:'法宝',armor:'护甲',accessory:'灵饰'}[slot];
  t.textContent='🎁 '+RARITY_NAMES[item.r]+' '+slotName+' · '+item.n;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
function showToast(msg){
  let t=document.createElement('div');
  t.style.cssText='position:fixed;top:15%;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(20,20,40,0.95);border:1px solid rgba(201,168,76,0.4);border-radius:8px;color:var(--gold-bright);font-family:STKaiti,KaiTi,serif;z-index:200;pointer-events:none;animation:toastAnim 2s ease forwards';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
let toastStyle=document.createElement('style');
toastStyle.textContent='@keyframes toastAnim{0%{opacity:0;transform:translateX(-50%) translateY(10px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}75%{opacity:1}100%{opacity:0}}';
document.head.appendChild(toastStyle);

// ===== 离线收益 =====
function calcOffline(){
  let now=Date.now(),elapsed=(now-S.lastSave)/1000;
  if(elapsed<30)return;
  let capped=Math.min(elapsed,8*3600);
  let gain=Math.floor(getRealm().qi*qiMult()*capped*0.3);
  if(gain>0){
    S.qi+=gain;S.totalQi+=gain;S.exp+=gain;
    let mins=Math.floor(capped/60);
    showToast('离线 '+Math.floor(mins/60)+'h'+(mins%60)+'m | 修炼获得 '+fmt(gain)+' 灵力');
  }
}

// ===== 初始化 =====
function init(){
  try{
    calcOffline();
    save();
    gameLoop=setInterval(tick,100);
    setInterval(save,15000);
    window.addEventListener('beforeunload',save);
    updateVisuals();
    updateUnlockBar();
    refreshAll();
    for(let i=0;i<10;i++)setTimeout(()=>spawnQiParticles(3),i*200);
    console.log('🧘 仙途 v0.3 — 大境界质变版 已就绪 |',getRealm().n,'|',fmt(S.qi),'灵');
    console.log(' 新增: 大境界解锁 · 灵根觉醒 · 装备强化 · 神通树 · 转世系统');
    console.log(' 挂机建议: 每突破一个大境界，回来看看有什么新解锁');
  }catch(e){
    console.error('游戏初始化失败:',e);
    document.body.innerHTML='<div style="color:#c9a84c;text-align:center;padding:40px;font-family:sans-serif"><h2>初始化失败</h2><p>'+e.message+'</p><button onclick="localStorage.removeItem(\'xx2_save\');location.reload()" style="margin-top:20px;padding:10px 30px">清除存档重试</button></div>';
  }
}
init();
</script>
